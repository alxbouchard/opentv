# OpenTV Pi : dossiers d'état (systemd-tmpfiles). Les jobs réseau restent privés (0700 opentv).
d /var/lib/opentv 0700 opentv opentv -
d /var/lib/opentv/netjobs 0700 opentv opentv -
d /var/lib/opentv/netjobs-tmp 0700 opentv opentv -
d /var/lib/opentv/netresults 0700 opentv opentv -
d /var/lib/opentv/foryou 0700 opentv opentv -
d /var/lib/opentv-kiosk 0700 opentv-kiosk opentv-kiosk -
# fichiers clients des agents émis par root (agent-<id>-<uid>.json, root:<groupe privé> 0640) : aucun home touché
d /etc/opentv 0755 root root -
d /etc/opentv/agents 0755 root root -
