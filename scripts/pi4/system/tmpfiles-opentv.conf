# OpenTV Pi : dossiers d'état (systemd-tmpfiles). Les jobs réseau restent privés (0700 opentv).
d /var/lib/opentv 0700 opentv opentv -
d /var/lib/opentv/netjobs 0700 opentv opentv -
d /var/lib/opentv/netjobs-tmp 0700 opentv opentv -
d /var/lib/opentv/netresults 0700 opentv opentv -
d /var/lib/opentv/foryou 0700 opentv opentv -
# connexion de Muse depuis la TV : jobs du service (jeton SDK le temps de la prise en charge par le helper root) et
# progression rendue par ce helper ; journal root de la séance en cours (reprise après plantage)
d /var/lib/opentv/musejobs 0700 opentv opentv -
d /var/lib/opentv/musejobs-tmp 0700 opentv opentv -
d /var/lib/opentv/museresults 0700 opentv opentv -
d /var/lib/opentv-muse-setup 0700 root root -
d /var/lib/opentv-kiosk 0700 opentv-kiosk opentv-kiosk -
# pont Muse : identité/appariement/jeton SDK du compte opentv-muse (0600), jamais lisibles par un autre compte
d /var/lib/opentv-muse 0700 opentv-muse opentv-muse -
# fichiers clients des agents émis par root (agent-<id>-<uid>.json, root:<groupe privé> 0640) : aucun home touché
d /etc/opentv 0755 root root -
d /etc/opentv/agents 0755 root root -
# jeton TMDb des notes (/etc/opentv/tmdb/token, root:opentv 0640, déposé par opentv-pi catalogue ratings-credential) :
# dossier créé ICI, à l'installation et à chaque démarrage, AVANT toute unité, pour que InaccessiblePaths= de toutes
# les autres unités le masque toujours. Jamais recréé ni renommé pendant que les services tournent (masque détaché).
d /etc/opentv/tmdb 0750 root opentv -
