# OpenTV Pi : touches d'alimentation ignorées par systemd-logind (drop-in dédié, retiré par uninstall.sh).
# Une télécommande USB 2,4 GHz (touche Power = KEY_POWER) ou la télécommande de la TV par HDMI-CEC (Power -> KEY_POWER
# dans rc-cec) éteindrait sinon la boîte au lieu de la TV. Les 7 touches de navigation ne sont pas concernées.
# Effectif au prochain démarrage de la boîte (aucun redémarrage de logind par l'installateur).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
