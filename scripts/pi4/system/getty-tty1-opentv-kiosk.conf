# OpenTV Pi : aucune invite de connexion sur tty1 tant que le kiosque est ACTIVÉ (drop-in dédié, retiré par
# uninstall.sh). Rien n'est masqué ni désactivé : « sudo systemctl disable --now opentv-kiosk » rend la console
# tty1 (sudo systemctl start getty@tty1), et le prochain démarrage la rétablit. SSH et le mode de secours ne sont pas
# concernés. Les autres drop-ins (ex. autologin de raspi-config) restent appliqués.
[Unit]
ConditionPathExists=!/etc/systemd/system/multi-user.target.wants/opentv-kiosk.service
