# OpenTV Pi : comptes système (systemd-sysusers). Aucun mot de passe, aucun shell de connexion.
g opentv-agent -
u opentv - "OpenTV service" /var/lib/opentv /usr/sbin/nologin
u opentv-kiosk - "OpenTV kiosque" /var/lib/opentv-kiosk /usr/sbin/nologin
m opentv opentv-agent
m opentv video
m opentv-kiosk video
m opentv-kiosk render
m opentv-kiosk input
