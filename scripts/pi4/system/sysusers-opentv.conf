# OpenTV Pi : comptes système (systemd-sysusers). Aucun mot de passe, aucun shell de connexion.
g opentv-agent -
u opentv - "OpenTV service" /var/lib/opentv /usr/sbin/nologin
u opentv-kiosk - "OpenTV kiosque" /var/lib/opentv-kiosk /usr/sbin/nologin
# aide des touches du lecteur « Regarder » : groupe input donné par son unité seulement (jamais par ce fichier)
u opentv-keys - "OpenTV touches du lecteur" / /usr/sbin/nologin
m opentv opentv-agent
m opentv video
m opentv-kiosk video
m opentv-kiosk render
# opentv-kiosk n'est PAS membre de input : opentv-kiosk.service l'ajoute à Cage seul (SupplementaryGroups=input),
# le contrôleur du lecteur et son Chromium (même compte) ne l'ont jamais. install.sh retire l'ancienne appartenance.
