<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OpenTV démarre…</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0d1117; color: #f0f3f6;
    font-family: "Noto Sans", "DejaVu Sans", sans-serif; display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  h1 { font-size: 72px; color: #58a6ff; margin: 0 0 24px; }
  p { font-size: 36px; color: #8b949e; }
</style>
</head>
<body>
<div class="box">
  <h1>OpenTV</h1>
  <p id="msg">Démarrage du tableau de bord…</p>
</div>
<script>
/* Page de secours locale (file://) : revient au tableau de bord dès que le service répond sur 127.0.0.1:8080. */
(function () {
  var tries = 0, port = /^#[0-9]{4,5}$/.test(location.hash) ? location.hash.slice(1) : "8080";
  var base = "http://127.0.0.1:" + port;
  function probe() {
    tries += 1;
    fetch(base + "/healthz", { mode: "no-cors", cache: "no-store" })
      .then(function () { location.replace(base + "/tv"); })
      .catch(function () {
        if (tries > 10) { document.getElementById("msg").textContent = "Le service OpenTV ne répond pas encore. Nouvel essai…"; }
        setTimeout(probe, 3000);
      });
  }
  // télécommande : les touches de navigation du navigateur (Retour, Accueil…) ne quittent jamais cette page
  document.addEventListener("keydown", function (e) {
    var k = e.key || "", kc = e.keyCode || 0;
    if (/^(BrowserBack|BrowserForward|BrowserHome|BrowserSearch|BrowserFavorites|GoBack|GoHome|Backspace)$/.test(k) ||
        kc === 166 || kc === 167 || kc === 172) { e.preventDefault(); }
  });
  document.addEventListener("mouseup", function (e) { if (e.button === 3 || e.button === 4) { e.preventDefault(); } });
  probe();
})();
</script>
</body>
</html>
